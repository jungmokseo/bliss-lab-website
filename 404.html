<!DOCTYPE html>

<head>

<title>페이지를 찾을 수 없습니다 · Page not found | BLISS Lab</title>
<!-- GitHub Pages serves this file for unknown addresses at any depth, so every URL here starts at the site root. -->
<link rel="icon" href="/images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Same palette and type as the home page (index.html). */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #FAFAFA;
  --white: #FFFFFF;
  --text-primary: #1A1A1A;
  --text-secondary: #555555;
  --text-muted: #6b6b6b;
  --accent: #0055FF;
  --border: #E5E5E5;
  --border-light: #F0F0F0;
  --nav-height: 68px;
  --max-width: 1320px;
  --gutter: 36px;
  --kr-font: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
}
html { font-size: 16px; }
body {
  min-height: 100vh; display: flex; flex-direction: column;
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg); color: var(--text-primary);
  line-height: 1.6; -webkit-font-smoothing: antialiased;
  overflow-wrap: anywhere;
}
a { text-decoration: none; color: inherit; }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
header {
  height: var(--nav-height); display: flex; align-items: center;
  background: rgba(255,255,255,0.96); border-bottom: 1px solid var(--border-light);
}
.inner { max-width: var(--max-width); width: 100%; margin: 0 auto; padding: 0 var(--gutter); }
.logo {
  display: inline-flex; align-items: center; min-height: 44px;
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.35rem; letter-spacing: -0.02em;
}
.logo .accent { color: var(--accent); }
main { flex: 1; display: flex; align-items: center; padding: 72px 0; }
.label {
  font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--accent); margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
}
.label::before { content: ''; width: 24px; height: 2px; background: var(--accent); }
.block { max-width: 640px; }
.block + .block { margin-top: 48px; padding-top: 40px; border-top: 1px solid var(--border); }
.block[lang="ko"] { font-family: var(--kr-font); line-height: 1.75; word-break: keep-all; }
h1, h2 { font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 14px; }
h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); }
h2 { font-family: 'Playfair Display', serif; font-size: clamp(1.6rem, 4.4vw, 2.4rem); }
p { font-size: 1rem; color: var(--text-secondary); margin-bottom: 26px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.btn-primary, .btn-outline {
  display: inline-flex; align-items: center; justify-content: center; min-height: 48px;
  padding: 12px 24px; font-size: 0.85rem; border-radius: 6px; transition: all 0.3s;
}
.btn-primary { font-weight: 600; background: var(--accent); color: #fff; }
.btn-primary:hover { background: #0044CC; }
.btn-outline { font-weight: 500; color: var(--text-primary); border: 1.5px solid var(--border); }
.btn-outline:hover { border-color: var(--text-primary); }
footer { padding: 28px 0; border-top: 1px solid var(--border-light); font-size: 0.78rem; color: var(--text-muted); }
@media (max-width: 768px) {
  :root { --gutter: 24px; }
  main { padding: 48px 0; }
}
</style>
</head>

      <div class="actions">
        <a class="btn-primary" href="/">연구실 홈</a>
        <a class="btn-outline" href="/resources/ko/index.html">연구 라이브러리</a>

      <div class="actions">
        <a class="btn-primary" href="/?lang=en">Lab home</a>
        <a class="btn-outline" href="/resources/en/index.html">Research Library</a>
      </div>
    </section>
  </div>
</main>
<footer>
  <div class="inner">BLISS Lab · Yonsei University</div>
</footer>
</body>
</html>
